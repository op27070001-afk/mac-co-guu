<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Mặc Có Guu 🫶🎀 | Tìm outfit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#222;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}header{background:#fff;border-bottom:1px solid #eceae7;text-align:center;padding:25px 15px}h1{font-family:Georgia,serif;letter-spacing:.12em;font-size:27px;font-weight:400;margin:0}header p{font-size:11px;letter-spacing:.25em;color:#888;margin:10px 0 0}main{max-width:680px;margin:0 auto;padding:35px 18px}.intro{text-align:center;margin-bottom:25px}.intro h2{font-family:Georgia,serif;font-size:25px;font-weight:400}.intro p{color:#777;font-size:14px;line-height:1.6}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid #d9d6d1;background:#fff;padding:16px;font-size:16px;border-radius:4px;text-transform:uppercase}.btn{border:0;border-radius:4px;background:#202020;color:#fff;padding:15px 18px;font-size:14px;cursor:pointer}.hint{text-align:center;color:#999;font-size:12px;margin:13px 0 25px}.status{text-align:center;color:#777;font-size:13px;line-height:1.6;min-height:22px}.product{background:white;border:1px solid #eee;border-radius:8px;overflow:hidden;margin:16px 0}.product img{width:100%;max-height:420px;object-fit:cover;display:block;background:#f1efec}.product-body{padding:20px}.code{font-size:11px;letter-spacing:.18em;color:#888}.product h3{font-family:Georgia,serif;font-size:23px;font-weight:400;margin:9px 0 17px}.buy{display:block;text-align:center;text-decoration:none;background:#222;color:#fff;padding:15px;border-radius:4px}.dates{margin:26px 0}.dates h2{font-family:Georgia,serif;font-size:20px;font-weight:400}.date-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.date-folder{background:white;border:1px solid #e8e5e1;border-radius:7px;padding:17px 12px;text-align:left;cursor:pointer;color:#222}.date-folder strong{display:block;font-size:15px}.date-folder span{font-size:12px;color:#888}.date-folder.active{border-color:#222;background:#f4f3f1}.folder-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px}.folder-head button{border:0;background:transparent;text-decoration:underline;cursor:pointer}.empty{text-align:center;padding:35px 15px;color:#777}footer{text-align:center;color:#aaa;font-size:11px;padding:35px}
</style>
</head>
<body>
<header><h1>Mặc Có Guu 🫶🎀</h1><p>SHOP MY OUTFITS</p></header>
<main>
<div class="intro"><h2>Tìm outfit của bạn</h2><p>Nhập mã xuất hiện trong video TikTok để xem đúng sản phẩm và mua trên Shopee.</p></div>
<form id="searchForm" class="search"><input id="search" placeholder="Nhập mã, ví dụ A1" autocomplete="off" aria-label="Mã sản phẩm"><button class="btn">Tìm kiếm</button></form>
<div class="hint">Ví dụ: A1 · A2 · B1</div>
<div id="status" class="status" role="status" aria-live="polite">Đang tải outfit...</div>
<section class="dates"><h2>Outfit theo ngày</h2><div id="folders" class="date-grid"></div></section>
<section id="results" aria-live="polite"></section>
</main>
<footer>Mặc Có Guu 🫶🎀 · Curated with love</footer>
<script>
// THAY URL BEN DUOI BANG LINK WEB APP /exec CUA BAN.
const API_URL = 'https://script.google.com/macros/s/AKfycbwNQpaxcKjmHudewwTbPSQxUeOztyzUEwVUmnyTjedYXQDlc2vWlmKClBaO69txNFMNSw/exec';
(function(){
const $=id=>document.getElementById(id);
let products=[],selectedDate='';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{if(!d)return 'Chưa phân ngày';let a=d.split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:d};
function productCard(p){let image=p.image&&/^https:\/\//i.test(p.image)?'<img alt="'+safe(p.name)+'" src="'+safe(p.image)+'" loading="lazy">':'';let buy=p.link&&/^https:\/\//i.test(p.link)?'<a class="buy" href="'+safe(p.link)+'" target="_blank" rel="noopener noreferrer sponsored">Mua trên Shopee ↗</a>':'<p style="color:#999;font-size:13px">Chưa có link mua.</p>';return '<article class="product">'+image+'<div class="product-body"><div class="code">'+safe(p.code)+' · '+safe(fmt(p.date))+'</div><h3>'+safe(p.name)+'</h3>'+buy+'</div></article>'}
function renderFolders(){let counts={};products.forEach(p=>{let d=p.date||'undated';counts[d]=(counts[d]||0)+1});$('folders').innerHTML=Object.keys(counts).sort().reverse().map(d=>'<button type="button" class="date-folder '+(selectedDate===d?'active':'')+'" data-date="'+safe(d)+'"><strong>📁 '+safe(fmt(d==='undated'?'':d))+'</strong><span>'+counts[d]+' sản phẩm</span></button>').join('')||'<p>Chưa có outfit.</p>'}
function render(){let q=$('search').value.trim().toUpperCase();let matches=q?products.filter(p=>p.code.toUpperCase()===q):selectedDate?products.filter(p=>(p.date||'undated')===selectedDate):[];let heading=!q&&selectedDate?'<div class="folder-head"><h2>Ngày '+safe(fmt(selectedDate==='undated'?'':selectedDate))+'</h2><button type="button" id="backFolders">Đóng</button></div>':'';$('results').innerHTML=heading+(!q&&!selectedDate?'':!matches.length?'<div class="empty">Không tìm thấy sản phẩm. Hãy thử mã hoặc ngày khác nhé.</div>':matches.map(productCard).join(''));renderFolders()}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();selectedDate='';render()});
$('search').addEventListener('input',()=>{if($('search').value.trim())selectedDate='';render()});
$('folders').addEventListener('click',e=>{let b=e.target.closest('[data-date]');if(!b)return;selectedDate=b.dataset.date;$('search').value='';render();$('results').scrollIntoView({behavior:'smooth',block:'start'})});
$('results').addEventListener('click',e=>{if(e.target.id==='backFolders'){selectedDate='';render()}});
async function load(){
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(API_URL)){$('status').textContent='Chưa cài đặt link Apps Script. Hãy thay API_URL trong index.html.';return}
 try{
  const response=await fetch(API_URL,{redirect:'follow',cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data))throw Error(data.error||'Dữ liệu không đúng định dạng');
  products=data.filter(p=>p&&p.code&&String(p.code).toLowerCase()!=='undefined').map(p=>({code:String(p.code).trim().toUpperCase(),date:String(p.date||'').trim(),image:String(p.image||'').trim(),link:String(p.link||'').trim(),name:String(p.name||'').trim()||'Outfit '+String(p.code).trim().toUpperCase()}));
  $('status').textContent=products.length?'Đã cập nhật '+products.length+' outfit':'Chưa có outfit nào trong Google Sheets.';
  render();
 }catch(err){console.error('Không tải được outfit:',err);$('status').textContent='Chưa tải được dữ liệu. Kiểm tra link Apps Script, quyền truy cập và khả năng truy cập từ GitHub Pages.'}
}
load();
})();
</script>
</body></html>
